# ============================================================================
# WinFire Installer Build — GitHub Actions
#
# 触发条件：仅当 VERSION.default 文件发生变化时，自动生成安装包。
# 也可通过 workflow_dispatch 手动触发（用于测试）。
#
# 流程：
#   1. 安装 Inno Setup 6（choco）
#   2. 执行 scripts/build_installer.ps1（编译 VS 工程 + 构建词库 + 打包）
#   3. 上传 dist\WinFire-Setup.exe 到 Actions Artifact
# ============================================================================
name: Build Installer

on:
  push:
    paths:
      - 'VERSION.default'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Install ATL Component (required by fire_tsf TIP)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          if (-not $vsPath) { throw "VS not found by vswhere" }
          Write-Host "VS path: $vsPath"

          # Check if ATL is already installed
          $hasAtl = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.ATL
          if ($hasAtl) { Write-Host "ATL already installed"; exit 0 }

          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $vsInstaller)) { throw "vs_installer.exe not found at $vsInstaller" }
          Write-Host "Installing ATL (this may take 2-3 minutes)..."
          & $vsInstaller modify --installPath $vsPath --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --includeRecommended
          # 3010 = restart requested, still a success
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "ATL install failed (exit code $LASTEXITCODE)"
          }
          Write-Host "ATL installed successfully"

      - name: Build Installer
        shell: pwsh
        run: .\scripts\build_installer.ps1

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinFire-Setup
          path: dist\WinFire-Setup.exe
          if-no-files-found: error