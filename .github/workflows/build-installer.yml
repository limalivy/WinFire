# ============================================================================
# WinFire Installer Build — GitHub Actions
#
# 触发条件：仅当 VERSION.default 文件发生变化时，自动生成安装包。
# 也可通过 workflow_dispatch 手动触发（用于测试）。
#
# 流程：
#   1. 安装 Inno Setup 6（choco）
#   2. 执行 scripts/build_installer.ps1（编译 VS 工程 + 构建词库 + 打包）
#   3. 上传 dist\WinFire-Setup.exe 到 Actions Artifact
# ============================================================================
name: Build Installer

on:
  push:
    paths:
      - 'VERSION.default'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Install ATL + MFC Components (required by fire_tsf TIP)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          Write-Host "VS path: $vsPath"

          # Search for atlbase.h on disk
          $foundAtl = & $vswhere -latest -find "VC\Tools\MSVC\**\atlmfc\include\atlbase.h" | Select-Object -First 1
          if ($foundAtl) { Write-Host "ATL already installed at: $foundAtl"; exit 0 }

          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (Test-Path $vsInstaller) {
            Write-Host "vs_installer.exe found, installing ATL..."
            & $vsInstaller modify --installPath $vsPath --add Microsoft.VisualStudio.Component.VC.ATL --passive --norestart --includeRecommended
            Write-Host "vs_installer exit code: $LASTEXITCODE"
            if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
              $foundAtl = & $vswhere -latest -find "VC\Tools\MSVC\**\atlmfc\include\atlbase.h" | Select-Object -First 1
              if ($foundAtl) { Write-Host "ATL installed at: $foundAtl"; exit 0 }
            }
          } else {
            Write-Host "vs_installer.exe NOT found at $vsInstaller"
          }

          # Fallback: install VS Build Tools with ATL via choco
          Write-Host "Trying choco install of VS Build Tools + ATL ..."
          choco install visualstudio2022buildtools --no-progress -y --package-parameters="--add Microsoft.VisualStudio.Component.VC.ATL --includeRecommended --passive --norestart"
          $foundAtl = & $vswhere -latest -find "VC\Tools\MSVC\**\atlmfc\include\atlbase.h" | Select-Object -First 1
          if (-not $foundAtl) { throw "ATL not found after all install attempts" }
          Write-Host "ATL installed at: $foundAtl"

      - name: Build Installer
        shell: pwsh
        run: .\scripts\build_installer.ps1

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinFire-Setup
          path: dist\WinFire-Setup.exe
          if-no-files-found: error